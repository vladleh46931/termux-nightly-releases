
name: Mirror Termux debug APK

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mirror-termux
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
      - name: Find latest available upstream APK
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          API="https://api.github.com/repos/termux/termux-app"
          RUNS="$(curl -fsSL \
            "$API/actions/workflows/debug_build.yml/runs?branch=master&event=push&status=success&per_page=20")"

          while IFS= read -r RUN; do
            RUN_ID="$(jq -r '.id' <<< "$RUN")"
            RUN_SHA="$(jq -r '.head_sha' <<< "$RUN")"

            ARTIFACTS="$(curl -fsSL \
              "$API/actions/runs/$RUN_ID/artifacts?per_page=100")"

            ARTIFACT="$(jq -c \
              '[.artifacts[]
                | select(.expired == false)
                | select(.name | endswith("apt-android-7-github-debug_arm64-v8a"))]
               | first // empty' <<< "$ARTIFACTS")"

            [[ -n "$ARTIFACT" ]] || continue

            ARTIFACT_ID="$(jq -r '.id' <<< "$ARTIFACT")"
            ARTIFACT_NAME="$(jq -r '.name' <<< "$ARTIFACT")"

            VERSION="$(printf '%s' "$ARTIFACT_NAME" |
              sed -E 's/^termux-app_v([^+]+)\+.*/\1/')"

            if [[ "$VERSION" == "$ARTIFACT_NAME" ]]; then
              echo "Could not determine APK version from artifact name."
              exit 1
            fi

            TAG="v${VERSION}-debug.${RUN_ID}"

            if gh release view "$TAG" \
              --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "Latest available build is already published: $TAG"
              exit 0
            fi

            {
              echo "skip=false"
              echo "run_id=$RUN_ID"
              echo "run_sha=$RUN_SHA"
              echo "artifact_id=$ARTIFACT_ID"
              echo "artifact_name=$ARTIFACT_NAME"
              echo "tag=$TAG"
            } >> "$GITHUB_OUTPUT"

            exit 0
          done < <(jq -c '.workflow_runs[]' <<< "$RUNS")

          echo "No unexpired arm64-v8a apt-android-7 APK found."
          exit 1

      - name: Download and extract APK
        if: steps.upstream.outputs.skip != 'true'
        env:
          ARTIFACT_ID: ${{ steps.upstream.outputs.artifact_id }}
          ARTIFACT_NAME: ${{ steps.upstream.outputs.artifact_name }}
        shell: bash
        run: |
          set -euo pipefail

          API="https://api.github.com/repos/termux/termux-app"
          ZIP="$RUNNER_TEMP/upstream-artifact.zip"
          OUT="$RUNNER_TEMP/termux-apk"

          mkdir -p "$OUT"

          curl -fsSL \
            "$API/actions/artifacts/$ARTIFACT_ID/zip" \
            -o "$ZIP"

          APK_PATH="$(unzip -Z1 "$ZIP" |
            grep -E '\.apk$' | sed -n '1p')"

          if [[ -z "$APK_PATH" ]]; then
            echo "No APK found in upstream artifact."
            exit 1
          fi

          unzip -j -o "$ZIP" "$APK_PATH" -d "$OUT"

          APK_FILE="$OUT/$(basename "$APK_PATH")"
          test -s "$APK_FILE"

          (
            cd "$OUT"
            sha256sum "$(basename "$APK_FILE")" \
              > "$(basename "$APK_FILE").sha256"
          )

          echo "APK: $APK_FILE"
          sha256sum "$APK_FILE"

      - name: Publish GitHub Release
        if: steps.upstream.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.upstream.outputs.tag }}
          RUN_ID: ${{ steps.upstream.outputs.run_id }}
          RUN_SHA: ${{ steps.upstream.outputs.run_sha }}
          ARTIFACT_NAME: ${{ steps.upstream.outputs.artifact_name }}
        shell: bash
        run: |
          set -euo pipefail

          OUT="$RUNNER_TEMP/termux-apk"
          APK_FILE="$(find "$OUT" -maxdepth 1 -type f -name '*.apk' -print -quit)"
          SHA_FILE="$APK_FILE.sha256"
          SHA256="$(sha256sum "$APK_FILE" | cut -d ' ' -f 1)"

          gh release create "$TAG" \
            "$APK_FILE" "$SHA_FILE" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$ARTIFACT_NAME" \
            --latest \
            --notes "Unofficial mirror of an official Termux GitHub Actions debug build.

          Variant: apt-android-7
          Architecture: arm64-v8a
          Upstream workflow run: https://github.com/termux/termux-app/actions/runs/$RUN_ID
          Upstream commit: $RUN_SHA
          SHA-256: $SHA256

          This repository republishes the APK without rebuilding or modifying it."
